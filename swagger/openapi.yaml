      tags: [Favorites]
      summary: Toggle favorite for a post
      security:
        - bearerAuth: []
        - cookieAuth: []
      description: |
        - ถ้ายังไม่ได้กด favorite → จะเพิ่มเข้าไป  
        - ถ้าเคยกด favorite แล้ว → จะลบออก
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteToggle"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  action:
                    type: string
                    enum: [added, removed]
              example:
                ok: true
                action: added
        "400":
          description: Bad request (post_id missing)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                example:
                  error: post_id is required

